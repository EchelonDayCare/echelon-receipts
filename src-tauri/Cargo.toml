[package]
name = "echelon-receipts"
version = "3.19.4"
description = "Echelon Daycare receipt generator"
authors = ["Echelon Daycare Society"]
edition = "2021"

[lib]
name = "echelon_receipts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["sqlcipher"]
# Enables SQLCipher-backed encrypted-DB paths in db_gate::open_encrypted.
# Turned on by default; disabling would require also switching the rusqlite
# feature from bundled-sqlcipher-vendored-openssl back to bundled.
sqlcipher = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# C-4: the "devtools" Cargo feature *force-enables* the WebView inspector even
# in release builds. Debug builds (`cargo tauri dev`) already get devtools
# for free without this feature — only omit it here to keep release builds
# from shipping an always-on inspector.
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname", "pool", "tokio1-rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
base64 = "0.22"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# v3.6.0: rayon parallelises photo curation (HEIC decode + sharpness
# scoring) across all cores. 4-8x speedup on modern Macs; Windows also
# benefits proportionally. Curation used to be the single-threaded
# bottleneck before FFmpeg even started encoding.
rayon = "1.10"
# v3.5.0: ab_glyph rasterises name-card text server-side so we no longer
# depend on the ffmpeg sidecar being built with libfreetype (drawtext).
# Fixes macOS sidecars crashing with `No such filter: 'drawtext'`.
ab_glyph = "0.2"
rqrr = "0.7"
# v3.2.4: rxing (pure-Rust ZXing port) — much more robust QR decoder than
# rqrr. Handles small module counts, blur, tilt, and JPEG artifacts that
# rqrr chokes on. Used as PRIMARY decoder in kid_sheet_ocr; rqrr kept as
# fast fallback so scans that already decode cheap don't get slower.
rxing = { version = "0.9", default-features = false, features = ["qrcode", "decoders", "multi_barcode_readers", "encoding_rs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "time", "rt-multi-thread"] }
futures = "0.3"
sqlparser = "0.52"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
jsonwebtoken = "9"
dirs = "6.0.0"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"
chacha20poly1305 = "0.11.0"
argon2 = "0.5.3"
sha2 = "0.11.0"
rand = "0.8"
url = "2.5"
subtle = "2.5"
libheif-rs = "2.2"
quick-xml = "0.36"
unicode-normalization = "0.1"
tempfile = "3"

# ── Website media pipeline (v3.20.0 PR 3 groundwork) ────────────────────
# img-parts: surgical EXIF/XMP/IPTC/ICC strip on JPEG/PNG/WebP without
# re-encoding the pixel data (marker-level edits only).
img-parts = "0.3"
# NOTE: ravif (AVIF encoder) is intentionally OMITTED from PR 3
# groundwork. rav1e + dav1d transitive-compile blew past the branch's
# time budget. AVIF encoding is stubbed with StubNotImplemented; PR 3.5
# re-introduces ravif AND swaps WebP to lossy libwebp in the same
# recipe-version bump. WebP + JPG (6 variants) is enough for PR 3 to
# ship the pipeline end-to-end.
# TODO: reintroduce ravif in PR3.5
# ravif = "0.11"
# blake3: fast, deterministic hash for derived filenames. Combined with
# sha2 (already in deps) to build the (source_hash, width, format,
# recipe_version) tuple key. Bumping the recipe version cache-busts
# every derived file at CDN edge.
blake3 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
# opt-level = 3 (runtime speed) — was "z" (size). Binary grows modestly
# but hot paths (SQLite queries, image decode, PPTX render) run 15-30%
# faster. lto=fat + strip keeps the shipped size within 5% of "z".
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false








